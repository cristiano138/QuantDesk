<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>看盘</title>
<style>
:root{
  --bg:#0b1220; --bg2:#0e1729; --card:#131f36; --card2:#182742;
  --ink:#eef3fb; --ink2:#b9c6dc; --muted:#7688a5; --line:#233350; --line2:#2c3d5e;
  --brand:#4d8dff; --brand-ink:#0d2c66; --brand-soft:#15305e;
  --up:#ff5252; --up-soft:#3a1720; --down:#22c07a; --down-soft:#11301f;
  --warn:#ffb454;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
  font-family:-apple-system,'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif;font-size:16px}
body{display:flex;flex-direction:column}
button{font-family:inherit;cursor:pointer}
/* ---------- 顶栏 ---------- */
.top{flex:none;display:flex;align-items:center;gap:10px;padding:calc(8px + var(--sat)) 14px 8px;
  background:linear-gradient(180deg,#0d1526,#0b1220);border-bottom:1px solid var(--line)}
.top .brand{font-size:17px;font-weight:800;letter-spacing:1px;color:#fff}
.top .clock{font-size:14px;color:var(--ink2);font-variant-numeric:tabular-nums}
.mkt{display:flex;align-items:center;gap:5px;font-size:13px;color:var(--ink2);
  background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.mkt i{width:8px;height:8px;border-radius:50%;background:#3d4d68}
.mkt i.on{background:var(--down);box-shadow:0 0 6px var(--down)}
.top .sp{flex:1}
.top .src{font-size:13px;color:var(--muted)}
/* ---------- 主体 ---------- */
main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;display:none;
  padding:12px 12px calc(86px + var(--sab))}
main.on{display:block}
/* ---------- 自选卡 ---------- */
.qcard{background:var(--card);border:1px solid var(--line);border-radius:16px;
  padding:14px 16px;margin-bottom:12px}
.qcard .hd{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.qcard .nm{font-size:19px;font-weight:750}
.qcard .cd{font-size:13px;color:var(--muted);margin-top:3px}
.qcard .px{font-size:31px;font-weight:800;line-height:1;text-align:right;
  font-variant-numeric:tabular-nums}
.qcard .pct{font-size:15px;text-align:right;margin-top:5px;font-variant-numeric:tabular-nums}
.up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--ink2)}
.g{display:grid;grid-template-columns:repeat(4,1fr);gap:10px 8px;margin-top:13px;
  font-size:12px;color:var(--muted)}
.g b{display:block;font-size:15.5px;color:var(--ink);font-weight:650;margin-top:3px;
  font-variant-numeric:tabular-nums}
.g .w2{grid-column:span 2}
.qcard .go{margin-top:12px;width:100%;padding:9px 0;border:0;border-radius:10px;
  background:var(--card2);color:var(--brand);font-size:14px;font-weight:600;border:1px solid var(--line2)}
/* ---------- 图表页 ---------- */
.symbar{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;-webkit-overflow-scrolling:touch}
.symbar .chip{flex:none;font-size:14px;padding:8px 14px;border-radius:12px;
  background:var(--card);border:1px solid var(--line);color:var(--ink2);white-space:nowrap}
.symbar .chip.on{background:var(--brand-soft);border-color:var(--brand);color:#fff;font-weight:700}
.bigpx{display:flex;justify-content:space-between;align-items:flex-end;margin:4px 2px 12px}
.bigpx .nm{font-size:20px;font-weight:750}
.bigpx .cd{font-size:13px;color:var(--muted);margin-top:3px}
.bigpx .pv{text-align:right}
.bigpx .pv .p{font-size:36px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.bigpx .pv .c{font-size:15px;margin-top:6px;font-variant-numeric:tabular-nums}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;
  padding:14px;margin-bottom:12px}
.h{font-size:14px;font-weight:750;color:var(--ink2);margin:0 0 10px;
  display:flex;align-items:center;gap:8px}
.tag{font-size:11.5px;padding:2px 8px;border-radius:999px;background:var(--card2);
  color:var(--muted);border:1px solid var(--line2);font-weight:400}
table{width:100%;border-collapse:collapse;font-size:14.5px}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right;
  white-space:nowrap;font-variant-numeric:tabular-nums}
th:first-child,td:first-child{text-align:left;color:var(--muted)}
th{color:var(--muted);font-weight:600;font-size:12.5px}
tr:last-child td{border-bottom:0}
canvas{width:100%;display:block;border-radius:10px;background:var(--bg2)}
/* 图表读数条：点哪根读哪根 */
.readout{font-size:13.5px;color:var(--ink2);line-height:1.75;margin:0 0 8px;padding:9px 11px;
  border:1px solid var(--line);border-radius:10px;background:var(--bg2)}
.readout b{color:var(--ink);font-size:14.5px}
.zoomhint{display:flex;gap:8px;margin-top:6px;align-items:center}
.zoomhint button{font-size:12.5px;padding:4px 12px;border-radius:999px;border:1px solid var(--line2);
  background:var(--card);color:var(--ink2)}
.ma{font-variant-numeric:tabular-nums}
.ma0{color:#5aa0ff}.ma1{color:#ffb454}.ma2{color:#b48cff}.ma3{color:#22c07a}
/* ---------- 连接页 ---------- */
.srcrow{display:flex;align-items:center;gap:12px;padding:13px 4px;border-bottom:1px solid var(--line)}
.srcrow:last-child{border-bottom:0}
.srcrow .nm{font-size:16.5px;font-weight:700}
.srcrow .st{font-size:12.5px;color:var(--muted);margin-top:3px}
.srcrow .body{flex:1;min-width:0}
.dot{width:10px;height:10px;border-radius:50%;background:#3d4d68;flex:none}
.dot.ok{background:var(--down)} .dot.bad{background:var(--up)}
.srcrow .use{font-size:13.5px;padding:7px 14px;border-radius:10px;border:1px solid var(--line2);
  background:var(--card2);color:var(--ink2)}
.srcrow .use.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:700}
.links{display:flex;flex-wrap:wrap;gap:9px}
.links a{flex:1;min-width:44%;text-align:center;text-decoration:none;font-size:14.5px;font-weight:600;
  padding:11px 6px;border-radius:12px;background:var(--card2);border:1px solid var(--line2);color:var(--ink)}
.bigbtn{width:100%;padding:13px 0;border:0;border-radius:12px;background:var(--brand);
  color:#fff;font-size:16.5px;font-weight:750}
.pill{display:inline-flex;align-items:center;gap:8px;font-size:14px;padding:7px 12px;
  border-radius:999px;background:var(--card2);border:1px solid var(--line2);color:var(--ink);margin:0 8px 8px 0}
.pill i{font-style:normal;color:var(--muted);font-size:13px}
.pill b{font-style:normal;color:var(--muted);font-size:15px;padding:0 3px}
.mini{font-size:13.5px;padding:7px 13px;border-radius:10px;border:1px solid var(--line2);
  background:var(--card2);color:var(--ink2)}
input[type=text]{font-size:15.5px;padding:11px 12px;border:1px solid var(--line2);
  border-radius:11px;background:var(--bg2);color:var(--ink);width:100%}
input::placeholder{color:var(--muted)}
.edit{display:flex;gap:8px;margin-top:10px}
/* ---------- 底栏 / 悬浮加号 ---------- */
#tabbar{flex:none;display:flex;background:#0d1526;border-top:1px solid var(--line);
  padding:6px 8px calc(6px + var(--sab))}
#tabbar button{flex:1;border:0;background:none;color:var(--muted);font-size:12px;
  padding:5px 0 3px;position:relative}
#tabbar button .ic{display:block;font-size:20px;line-height:1.15;margin-bottom:1px}
#tabbar button.on{color:var(--brand);font-weight:700}
#fab{position:absolute;right:16px;bottom:calc(84px + var(--sab));width:54px;height:54px;
  border-radius:50%;border:0;background:var(--brand);color:#fff;font-size:30px;font-weight:300;
  box-shadow:0 6px 18px rgba(28,84,201,.45);z-index:40;line-height:1}
#fab:active{transform:scale(.94)}
/* ---------- 选股 sheet ---------- */
.sheet{position:fixed;inset:0;z-index:60;display:none;flex-direction:column;
  background:var(--bg)}
.sheet.on{display:flex}
.sheet .sh{flex:none;display:flex;align-items:center;gap:10px;
  padding:calc(10px + var(--sat)) 14px 10px;border-bottom:1px solid var(--line);
  background:#0d1526}
.sheet .sh .t{font-size:17px;font-weight:750}
.sheet .sh .x{margin-left:auto;border:0;background:var(--card2);color:var(--ink2);
  width:34px;height:34px;border-radius:50%;font-size:17px}
.sheet .shb{flex:1;overflow-y:auto;padding:12px 14px calc(20px + var(--sab))}
.pkTabs{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.pkTabs button{font-size:13.5px;padding:7px 13px;border-radius:999px;border:1px solid var(--line2);
  background:var(--card);color:var(--ink2)}
.pkTabs button.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:700}
.pkList{border:1px solid var(--line);border-radius:12px;background:var(--card);overflow:hidden}
.pkItem{display:flex;justify-content:space-between;align-items:center;gap:10px;
  padding:12px 13px;border-bottom:1px solid var(--line)}
.pkItem:last-child{border-bottom:0}
.pkItem .nm2{font-weight:700;font-size:16px;color:var(--ink)}
.pkItem .cd{color:var(--muted);font-size:12.5px;margin-top:2px}
.pkItem button{font-size:14px;padding:6px 16px;border-radius:999px;border:1px solid var(--brand);
  background:var(--brand-soft);color:#9dc0ff;font-weight:700}
.pkItem button.has{border-color:var(--line2);background:var(--card2);color:var(--muted);font-weight:400}
.pkPage{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:13px;color:var(--muted)}
.pkPage button{font-size:13.5px;padding:7px 14px;border-radius:10px;border:1px solid var(--line2);
  background:var(--card);color:var(--ink2)}
.pkPage button:disabled{opacity:.4}
.note{font-size:13px;color:var(--muted);line-height:1.6;margin:10px 2px}
.err{font-size:13.5px;color:var(--up);background:var(--up-soft);border:1px solid #55232a;
  border-radius:10px;padding:8px 11px;margin:10px 0}
.spin{display:inline-block;width:12px;height:12px;border:2px solid #33456a;
  border-top-color:var(--brand);border-radius:50%;animation:r .7s linear infinite;vertical-align:-2px}
@keyframes r{to{transform:rotate(360deg)}}
#conn-msg{font-size:13px;color:var(--muted);margin-top:8px;min-height:16px}
</style>
</head>
<body>
  <header class="top">
    <span class="brand">看盘</span>
    <span class="clock" id="clock">--:--:--</span>
    <span class="mkt"><i id="dotCN"></i>A股</span>
    <span class="mkt"><i id="dotHK"></i>港股</span>
    <span class="sp"></span>
    <span class="src" id="srcTag">—</span>
  </header>

  <main id="tab-watch" class="tab on"><div id="list"></div></main>

  <main id="tab-chart" class="tab">
    <div class="symbar" id="symbar"></div>
    <div id="chartHead"></div>
    <div class="card"><div class="h">五档盘口 <span class="tag">腾讯行情提供档位</span></div><div id="book"></div></div>
    <div class="card">
      <div class="h">分时 <span class="tag">价格 / 均价</span></div>
      <div id="rd-ts" class="readout" style="display:none"></div>
      <canvas id="cv-ts" height="230"></canvas>
    </div>
    <div class="card">
      <div class="h">日 K <span class="tag">前复权</span><span class="tag" id="maLegend"></span></div>
      <div id="rd-kl" class="readout" style="display:none"></div>
      <canvas id="cv-kl" height="300"></canvas>
    </div>
    <div class="card">
      <div class="h">当日买卖量分层 <span class="tag">按单笔成交额</span><span class="tag">含盘后成交</span></div>
      <div id="flow"></div>
    </div>
  </main>

  <main id="tab-link" class="tab">
    <div class="card">
      <div class="h">行情源</div>
      <div id="srcList"></div>
      <div id="conn-msg"></div>
    </div>
    <div class="card">
      <div class="h">添加自选</div>
      <button class="bigbtn" id="btnPick">＋ 选股票</button>
      <div class="edit">
        <input type="text" id="addInput" placeholder="或直接输入代码：600519、00700.HK">
        <button class="mini" id="btnAdd">添加</button>
      </div>
      <div id="pool" style="margin-top:12px"></div>
    </div>
    <div class="card">
      <div class="h">在手机 App 中打开</div>
      <div class="links" id="openLinks"></div>
    </div>
  </main>

  <nav id="tabbar">
    <button data-tab="watch" class="on"><span class="ic">★</span>自选</button>
    <button data-tab="chart"><span class="ic">📈</span>图表</button>
    <button data-tab="link"><span class="ic">⚡</span>连接</button>
  </nav>
  <button id="fab" title="选股票">＋</button>

  <div class="sheet" id="sheet">
    <div class="sh">
      <span class="t">选股票</span>
      <span style="flex:1"></span>
      <button class="x" id="sheetClose">✕</button>
    </div>
    <div class="shb">
      <input type="text" id="pkQuery" placeholder="名称 / 拼音首字母 / 代码：茅台、GZMT、00700">
      <div class="pkTabs" id="pkTabs"></div>
      <div class="pkList" id="pkList"></div>
      <div class="pkPage" id="pkPage"></div>
      <div class="note" id="pkNote">按名称搜索，或点板块直接往下翻。只列正常上市交易的股票。</div>
    </div>
  </div>

<script>
"use strict";
/* ===================================================================
   看盘 —— 单文件、只在本机运行、无自建服务器、只读（没有任何下单入口）
   取数：这台手机直接向公开行情接口取（脚本回调，不经第三台机器）
   =================================================================== */

var LS = {pool:'qd.pool.v1', src:'qd.source.v1', iv:'qd.interval.v1', names:'qd.names.v1'};
var DEFAULT_POOL = ['600000.SH','000001.SZ','600519.SH','300750.SZ',
                    '00700.HK','09988.HK','03690.HK','01810.HK'];

var state = {
  pool: loadPool(),
  source: localStorage.getItem(LS.src) || 'tx',
  interval: parseInt(localStorage.getItem(LS.iv) || '1', 10),
  rows: {},
  tab: 'watch',
  sel: null,           // 图表页当前标的
  timer: null,
  busy: false,
  lastFetch: 0,
  lastErr: '',
  offline: !navigator.onLine,
  tickCache: {},
  names: loadNames(),
  cool: {},
  picker: null,
  srcStatus: {},       // 源 -> 'ok' | 'bad' | 'busy'
  charts: {},          // key -> mountChart 状态（读数条按钮用）
  chartAt: {},         // 标的 -> 上次取分时/日K的时刻（10 秒节流）
};

/* 每个源的节拍下限（秒）：一次刷新要发多少请求决定能不能跑极速档。
   腾讯一次请求覆盖整池 → 1 秒可行；东财逐只请求 → 5 秒；同花顺逐只且更敏感 → 10 秒。 */
var SRC_MIN_IV = {tx: 1, em: 5, ths: 10};
var SRC_NAME = {tx: '腾讯行情', em: '东方财富行情', ths: '同花顺行情'};

/* ---------------- 代码体系 ---------------- */

function normalize(raw) {
  var s = String(raw || '').trim().toUpperCase().replace(/\s+/g, '');
  if (!s) return null;
  var m;
  if ((m = s.match(/^(\d{5,6})\.(SH|SZ|BJ|HK)$/))) return pad(m[1], m[2]);
  if ((m = s.match(/^(SH|SZ|BJ)(\d{6})$/))) return m[2] + '.' + m[1];
  if ((m = s.match(/^HK(\d{1,5})$/))) return pad(m[1].length < 5 ? m[1].padStart(5, '0') : m[1], 'HK');
  if ((m = s.match(/^(\d{1,5})\.(HK)$/))) return pad(m[1].padStart(5, '0'), 'HK');
  if ((m = s.match(/^(\d{6})$/))) {
    var p = s.slice(0, 1), mk;
    if (s.slice(0, 2) === '92') mk = 'BJ';
    else if (p === '6' || p === '9') mk = 'SH';
    else if (p === '4' || p === '8') mk = 'BJ';
    else mk = 'SZ';
    return s + '.' + mk;
  }
  if ((m = s.match(/^(\d{5})$/))) return s + '.HK';
  return null;
}
function pad(digit, market) {
  return market === 'HK' ? digit.padStart(5, '0') + '.HK' : digit + '.' + market;
}
function isHK(sym) { return sym.slice(-3) === '.HK'; }
function isBJ(sym) { return sym.slice(-2) === 'BJ'; }
function isKcb(sym) { return !isHK(sym) && /^(688|689)/.test(sym.slice(0, 3)); }

function txCode(sym) {
  if (isHK(sym)) return 'hk' + sym.slice(0, 5);
  return (sym.slice(-2) === 'SH' ? 'sh' : isBJ(sym) ? 'bj' : 'sz') + sym.slice(0, 6);
}
function emSecid(sym) {
  if (isHK(sym)) return '116.' + sym.slice(0, 5);
  return (sym.slice(-2) === 'SH' ? '1.' : '0.') + sym.slice(0, 6);
}
function thsCode(sym) { return (isHK(sym) ? 'hk_' : 'hs_') + sym.slice(0, 6); }

/* ---------------- 名称 ---------------- */

function loadNames() {
  try { return JSON.parse(localStorage.getItem(LS.names) || '{}') || {}; } catch (e) { return {}; }
}
function persistNames() {
  try { localStorage.setItem(LS.names, JSON.stringify(state.names)); } catch (e) {}
}
function rememberNames(rows) {
  var changed = false;
  Object.keys(rows || {}).forEach(function (sym) {
    var n = rows[sym] && rows[sym].name;
    if (n && state.names[sym] !== n) { state.names[sym] = n; changed = true; }
  });
  if (changed) persistNames();
}
function nameOf(sym, row) {
  var n = (row && row.name) || state.names[sym] || '';
  if (row && !row.name && n) row.name = n;
  return n;
}

/* ---------------- 成交量口径：用成交额反推，不猜 ---------------- */

function volDivisor(vol, amount, low, high, boardGuess) {
  if (vol <= 0 || amount <= 0 || !(high > 0) || !(low > 0)) return boardGuess === 'share' ? 100 : 1;
  function inBand(price) { return price >= low * 0.985 && price <= high * 1.015; }
  var asLot = inBand(amount / (vol * 100));
  var asShare = inBand(amount / vol);
  if (asShare && !asLot) return 100;
  if (asLot && !asShare) return 1;
  return boardGuess === 'share' ? 100 : 1;
}

/* ---------------- 脚本回调取数 ---------------- */

function loadScript(url, charset, timeoutMs) {
  return new Promise(function (resolve, reject) {
    var s = document.createElement('script');
    var done = false;
    var tm = setTimeout(function () {
      if (done) return; done = true;
      if (s.parentNode) s.parentNode.removeChild(s);
      reject(new Error('行情取数超时'));
    }, timeoutMs || 8000);
    s.src = url;
    if (charset) s.charset = charset;
    s.onload = function () { if (done) return; done = true; clearTimeout(tm); resolve(); };
    s.onerror = function () {
      if (done) return; done = true; clearTimeout(tm);
      if (s.parentNode) s.parentNode.removeChild(s);
      reject(new Error('行情来源连不上'));
    };
    document.head.appendChild(s);
  });
}

function jsonp(url, cbName, timeoutMs) {
  var real = '__qd_' + cbName;
  return new Promise(function (resolve, reject) {
    var settled = false;
    window[real] = function (data) {
      if (settled) return; settled = true; clearTimeout(tm); delete window[real]; resolve(data);
    };
    var tm = setTimeout(function () {
      if (settled) return; settled = true; delete window[real];
      reject(new Error('行情取数超时'));
    }, timeoutMs || 8000);
    loadScript(url + (url.indexOf('?') >= 0 ? '&' : '?') + 'cb=' + real, null, (timeoutMs || 8000) + 500)
      .catch(function (e) {
        if (settled) return; settled = true; clearTimeout(tm); delete window[real]; reject(e);
      });
  });
}

function thsCall(url, globalName, timeoutMs) {
  return new Promise(function (resolve, reject) {
    var settled = false;
    window[globalName] = function (data) {
      if (settled) return; settled = true; clearTimeout(tm); delete window[globalName]; resolve(data);
    };
    var tm = setTimeout(function () {
      if (settled) return; settled = true; delete window[globalName];
      reject(new Error('同花顺行情取数超时'));
    }, timeoutMs || 8000);
    loadScript(url, null, (timeoutMs || 8000) + 500).catch(function (e) {
      if (settled) return; settled = true; clearTimeout(tm); delete window[globalName]; reject(e);
    });
  });
}

/* ---------------- 腾讯：一次请求覆盖整池 ---------------- */

var TX_A = {name:1, code:2, last:3, prev:4, open:5, vol:6, outer:7, inner:8,
            bid:9, ask:19, ts:30, high:33, low:34, amount:37, amountMul:1e4,
            limitUp:47, limitDown:48, avg:51};

function parseTx(sym, parts) {

  var vol = rawVol / div;
  var outer = L.outer === null ? null : num(parts[L.outer]) / div;
  var inner = L.inner === null ? null : num(parts[L.inner]) / div;
  function levels(base) {
    var out = [];

  }
  function lim(v) { return v > 0 ? v : null; }   // 腾讯用 -1 占位"无涨跌停"

/* ---------------- 画布与图表（双指缩放 / 拖动 / 点选读数） ---------------- */

function prepCanvas(cv, h) {
  var dpr = window.devicePixelRatio || 1;
  var w = cv.clientWidth || 320;
  cv.width = w * dpr; cv.height = h * dpr; cv.style.height = h + 'px';
  var ctx = cv.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);
  return {ctx: ctx, w: w, h: h};
}

var MA_DAYS = [5, 10, 20, 60];
var MA_C = ['#5aa0ff', '#ffb454', '#b48cff', '#22c07a'];

function maSeries(rows, n) {
  var out = [], sum = 0;
  for (var i = 0; i < rows.length; i++) {
    sum += rows[i].c;
    if (i >= n) sum -= rows[i - n].c;
    out.push(i >= n - 1 ? sum / n : null);
  }
  return out;
}

function mountChart(cv, spec) {
  var rows = spec.rows || [];
  var key = spec.key;
  var read = document.getElementById('rd-' + key);
  if (rows.length < 2) {
    if (read) read.style.display = 'none';
    drawEmpty(cv, spec.height || 230, spec.empty || '没有数据');
    delete state.charts[key];
    return null;
  }
  var st = {i0: 0, i1: rows.length, sel: rows.length - 1, spec: spec, cv: cv, read: read};
  var mas = spec.type === 'k' ? MA_DAYS.map(function (n) { return {n: n, v: maSeries(rows, n)}; }) : [];

  function clampWin(i0, i1) {
    var minBars = 8;
    var w = Math.max(minBars, Math.min(rows.length, i1 - i0));
    if (i0 < 0) i0 = 0;
    if (i0 + w > rows.length) i0 = rows.length - w;
    return {i0: i0, i1: i0 + w};
  }
  function setWin(i0, i1) {
    var w = clampWin(i0, i1);
    st.i0 = w.i0; st.i1 = w.i1;
    if (st.sel < st.i0) st.sel = st.i0;
    if (st.sel >= st.i1) st.sel = st.i1 - 1;
    draw();
  }
  function pick(x, W) {
    var n = st.i1 - st.i0, step = W / n;
    return Math.max(st.i0, Math.min(st.i1 - 1, st.i0 + Math.floor(x / step)));
  }

  function draw() {
    var c = prepCanvas(cv, spec.height || 230), ctx = c.ctx, W = c.w, H = c.h;
    var view = rows.slice(st.i0, st.i1), n = view.length, step = W / n;
    var hi = -Infinity, lo = Infinity, vmax = 0;
    view.forEach(function (r) {
      hi = Math.max(hi, r.h != null ? r.h : r.price, r.avg || 0);
      lo = Math.min(lo, r.l != null ? r.l : r.price);
      vmax = Math.max(vmax, r.v || r.vol || 0);
    });
    if (spec.type === 'ts') {
      var pre = spec.pre || rows[0].price;
      var span = Math.max(hi - pre, pre - lo) || pre * 0.01;
      hi = pre + span; lo = pre - span;
    }
    mas.forEach(function (m) {
      for (var i = st.i0; i < st.i1; i++) {
        var v = m.v[i];
        if (v == null) continue;
        hi = Math.max(hi, v); lo = Math.min(lo, v);
      }
    });
    var padT = 10, padB = 30, volH = 28, priceH = H - padT - padB - volH;
    function y(p) { return padT + (hi - p) / (hi - lo || 1) * priceH; }

    ctx.strokeStyle = '#233350'; ctx.lineWidth = 1;
    for (var g = 0; g <= 3; g++) {
      var yy = padT + priceH * g / 3;
      ctx.beginPath(); ctx.moveTo(0, yy); ctx.lineTo(W, yy); ctx.stroke();
    }
    if (spec.type === 'ts' && spec.pre) {
      ctx.strokeStyle = '#33456a'; ctx.setLineDash([3, 3]);
      ctx.beginPath(); ctx.moveTo(0, y(spec.pre)); ctx.lineTo(W, y(spec.pre)); ctx.stroke();
      ctx.setLineDash([]);
    }
    view.forEach(function (r, k) {
      var x = k * step + step / 2;
      var vh = (r.v || r.vol || 0) / (vmax || 1) * volH;
      ctx.globalAlpha = .55;
      ctx.fillStyle = (r.c != null ? (r.c >= r.o ? '#ff5252' : '#22c07a')
                                  : (r.price >= (k ? view[k - 1].price : r.price) ? '#ff5252' : '#22c07a'));
      ctx.fillRect(k * step, H - padB + volH - vh, Math.max(1, step * .78), vh);
      ctx.globalAlpha = 1;
      if (spec.type === 'k') {
        var up = r.c >= r.o;
        ctx.strokeStyle = ctx.fillStyle = up ? '#ff5252' : '#22c07a';
        ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(x, y(r.h)); ctx.lineTo(x, y(r.l)); ctx.stroke();
        var bw = Math.max(1, step * .62);
        ctx.fillRect(x - bw / 2, y(Math.max(r.o, r.c)), bw,
                     Math.max(1, Math.abs(y(r.o) - y(r.c))));
      }
    });
    if (spec.type === 'ts') {
      ctx.strokeStyle = '#5aa0ff'; ctx.lineWidth = 2; ctx.beginPath();
      view.forEach(function (r, k) { var x = k * step + step / 2;
        k ? ctx.lineTo(x, y(r.price)) : ctx.moveTo(x, y(r.price)); });
      ctx.stroke();
      ctx.strokeStyle = '#ffb454'; ctx.lineWidth = 1.4; ctx.beginPath();
      var started = false;
      view.forEach(function (r, k) { if (!r.avg) return; var x = k * step + step / 2;
        started ? ctx.lineTo(x, y(r.avg)) : ctx.moveTo(x, y(r.avg)); started = true; });
      ctx.stroke();
    } else {
      mas.forEach(function (m, mi) {
        ctx.strokeStyle = MA_C[mi % MA_C.length]; ctx.lineWidth = 1.4; ctx.beginPath();
        var started = false;
        for (var i = st.i0; i < st.i1; i++) {
          var v = m.v[i]; if (v == null) continue;
          var x = (i - st.i0) * step + step / 2;
          started ? ctx.lineTo(x, y(v)) : ctx.moveTo(x, y(v)); started = true;
        }
        ctx.stroke();
      });
    }
    if (st.sel != null && st.sel >= st.i0 && st.sel < st.i1) {
      var r2 = rows[st.sel], sx = (st.sel - st.i0) * step + step / 2;
      var sy = y(r2.c != null ? r2.c : r2.price);
      ctx.strokeStyle = 'rgba(238,243,251,.5)'; ctx.lineWidth = 1; ctx.setLineDash([3, 3]);
      ctx.beginPath(); ctx.moveTo(sx, padT); ctx.lineTo(sx, H - padB); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, sy); ctx.lineTo(W, sy); ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = '#eef3fb';
      ctx.beginPath(); ctx.arc(sx, sy, 3, 0, 6.2832); ctx.fill();
    }
    ctx.fillStyle = '#7688a5'; ctx.font = '12px sans-serif'; ctx.textAlign = 'left';
    ctx.fillText(hi.toFixed(2), 3, padT + 11);
    ctx.fillText(lo.toFixed(2), 3, padT + priceH - 2);
    ctx.textAlign = 'center';
    ctx.fillText(view[0].d || view[0].t, step * 2, H - 7);
    ctx.fillText(view[n - 1].d || view[n - 1].t, W - step * 3, H - 7);
    readout(st, mas);
  }

  cv._chart = st;
  cv._setWin = setWin;
  st.setWin = setWin;          // 读数条上的缩小/放大/复位按钮要用
  state.charts[key] = st;
  bindGestures(cv, st, pick, setWin, draw);
  draw();
  return st;
}

function readout(st, mas) {
  if (!st.read) return;
  var rows = st.spec.rows, r = rows[st.sel];
  if (!r) { st.read.textContent = ''; st.read.style.display = 'none'; return; }
  st.read.style.display = 'block';
  var pre = st.spec.pre || r.prev || null;
  var pct = pre ? (r.c != null ? r.c : r.price) / pre * 100 - 100 : null;
  var parts = [];
  if (st.spec.type === 'k') {
    parts.push('<b>' + r.d + '</b>　开 ' + fx(r.o) + '　高 ' + fx(r.h) + '　低 ' + fx(r.l) +
      '　收 <b class="' + cls(pct) + '">' + fx(r.c) + '</b>');
    if (pct != null) parts.push('涨跌 <span class="' + cls(pct) + '">' + (pct > 0 ? '+' : '') +
      pct.toFixed(2) + '%</span>　量 ' + fmtVol(r.v, st.spec.volUnit || '手') + '　额 ' + fmtAmt(r.a));
    var line = [];
    (mas || []).forEach(function (m, i) {
      var v = m.v[st.sel];
      if (v != null) line.push('<span class="ma ma' + i + '">MA' + m.n + ' ' + fx(v) + '</span>');
    });
    if (line.length) parts.push(line.join('　'));
  } else {
    parts.push('<b>' + r.t + '</b>　价 <b>' + fx(r.price) + '</b>　均价 ' +
      (r.avg ? fx(r.avg) : '—'));
    if (pct != null) parts.push('较昨收 <span class="' + cls(pct) + '">' + (pct > 0 ? '+' : '') +
      pct.toFixed(2) + '%</span>　这一分钟 ' + fmtVol(r.vol, st.spec.volUnit || '手'));
  }
  parts.push('<span class="zoomhint">' + (st.i1 - st.i0) + '/' + rows.length + ' 根' +
    '<button data-zoom="-1" data-key="' + st.spec.key + '">缩小</button>' +
    '<button data-zoom="1" data-key="' + st.spec.key + '">放大</button>' +
    '<button data-zoom="0" data-key="' + st.spec.key + '">复位</button></span>');
  st.read.innerHTML = parts.join('<br>');
}
function fx(v) { return v == null ? '—' : Number(v).toFixed(2); }

/* 读数条上的缩放按钮（事件委托，一处绑定） */
document.addEventListener('click', function (e) {
  var b = e.target && e.target.closest ? e.target.closest('[data-zoom]') : null;
  if (!b) return;
  var st = state.charts[b.getAttribute('data-key')];
  if (!st) return;
  var z = b.getAttribute('data-zoom');
  var rows = st.spec.rows, n = st.i1 - st.i0;
  if (z === '0') { st.setWin(0, rows.length); return; }
  var w = Math.max(8, Math.min(rows.length, z === '1' ? Math.round(n / 1.5) : Math.round(n * 1.5)));
  var center = Math.round((st.i0 + st.i1) / 2);
  st.setWin(center - Math.round(w / 2), center - Math.round(w / 2) + w);
});

function bindGestures(cv, st, pick, setWin, draw) {
  var g = {mode: null, x0: 0, d0: 0, i0: 0, i1: 0, moved: 0, t0: 0};
  function dist(t) {
    var dx = t[0].clientX - t[1].clientX, dy = t[0].clientY - t[1].clientY;
    return Math.hypot(dx, dy);
  }
  cv.addEventListener('touchstart', function (e) {
    var t = e.touches;
    g.t0 = Date.now(); g.moved = 0;
    if (t.length >= 2) { g.mode = 'zoom'; g.d0 = dist(t); g.i0 = st.i0; g.i1 = st.i1; }
    else { g.mode = 'pan'; g.x0 = t[0].clientX; g.i0 = st.i0; g.i1 = st.i1; }
  }, {passive: true});
  cv.addEventListener('touchmove', function (e) {
    var t = e.touches, W = cv.clientWidth || 320, n = g.i1 - g.i0, step = W / n;
    if (g.mode === 'zoom' && t.length >= 2) {
      var d = dist(t);
      if (d > 0 && g.d0 > 0) {
        var w = Math.round(n * g.d0 / d);
        var center = Math.round((g.i0 + g.i1) / 2);
        setWin(center - Math.round(w / 2), center - Math.round(w / 2) + w);
      }
      e.preventDefault();
    } else if (t.length === 1) {
      var dx = t[0].clientX - g.x0;
      g.moved = Math.max(g.moved, Math.abs(dx));
      if (g.moved > 8) {
        setWin(g.i0 + Math.round(-dx / step), g.i1 + Math.round(-dx / step));
        e.preventDefault();
      }
    }
  }, {passive: false});
  cv.addEventListener('touchend', function (e) {
    if (g.mode === 'pan' && g.moved <= 8 && Date.now() - g.t0 < 600) {
      var t = e.changedTouches[0], rect = cv.getBoundingClientRect();
      st.sel = pick(t.clientX - rect.left, cv.clientWidth || 320);
      draw();
    }
    g.mode = null;
  });
  cv.addEventListener('mousedown', function (e) {
    g.mode = 'pan'; g.x0 = e.clientX; g.i0 = st.i0; g.i1 = st.i1; g.moved = 0;
  });
  cv.addEventListener('mousemove', function (e) {
    if (g.mode !== 'pan') return;
    var W = cv.clientWidth || 320, step = W / (g.i1 - g.i0);
    var dx = e.clientX - g.x0;
    g.moved = Math.max(g.moved, Math.abs(dx));
    if (g.moved > 4) setWin(g.i0 + Math.round(-dx / step), g.i1 + Math.round(-dx / step));
  });
  window.addEventListener('mouseup', function (e) {
    if (g.mode === 'pan' && g.moved <= 4) {
      var rect = cv.getBoundingClientRect();
      st.sel = pick(e.clientX - rect.left, cv.clientWidth || 320);
      draw();
    }
    g.mode = null;
  });
  cv.addEventListener('wheel', function (e) {
    e.preventDefault();
    var n = st.i1 - st.i0, w = Math.round(n * (e.deltaY > 0 ? 1.15 : 0.87));
    var at = pick(e.offsetX, cv.clientWidth || 320);
    var left = (at - st.i0) / n;
    var i0 = Math.round(at - w * left);
    setWin(i0, i0 + w);
  }, {passive: false});
}

function drawEmpty(cv, h, msg) {
  var c = prepCanvas(cv, h || 230);
  c.ctx.fillStyle = '#7688a5'; c.ctx.font = '14px sans-serif'; c.ctx.textAlign = 'center';

}

var BOARDS = [

  {label:'创业板', fs:'m:0+t:80'},

  {label:'港股主板', fs:'m:128+t:3'}
];
var HK_RMB_COUNTER_RE = /-[A-Z]{0,3}R$/;

function symFromPick(code, market) {
  var s = String(code);
  if (String(market) === '128' || String(market) === '116') return pad(s, 'HK');
  return normalize(s);
}

function pickerTab(idx) {
  state.picker = {mode: 'browse', board: idx, pn: 1, rows: [], loading: true, err: ''};
  renderPicker();
  pickerFetch();
}
function pickerGo(step) {
  var p = state.picker;
  if (!p || p.mode !== 'browse') return;
  p.pn = Math.max(1, p.pn + step);
  p.rows = []; p.loading = true; p.err = '';
  renderPicker();
  pickerFetch();
}
function pickerFetch() {
  var p = state.picker, b = BOARDS[p.board];
  var url = 'https://push2.eastmoney.com/api/qt/clist/get?pn=' + p.pn + '&pz=100' +
            '&po=0&np=1&fltt=2&invt=2&fid=f12&fs=' + encodeURIComponent(b.fs) +
            '&fields=f2,f3,f12,f13,f14';
  jsonp(url, 'cl' + p.board + '_' + p.pn, 9000).then(function (j) {
    var d = (j && j.data) || {};
    if (state.picker !== p) return;
    p.total = num(d.total) || 0;
    p.rows = (d.diff || []).filter(function (r) {
      /* 无当日行情的（退市/长期停牌，价格位是 '-'）不进列表——加了也取不到数 */
      return r && r.f12 && num(r.f2) > 0 && (String(r.f13) !== '128' || !HK_RMB_COUNTER_RE.test(String(r.f14 || '')));
    }).map(function (r) {
      var sym = symFromPick(r.f12, r.f13);
      if (sym && r.f14) state.names[sym] = r.f14;
      return sym ? {sym: sym, name: r.f14 || '', px: num(r.f2) || null,
                    pct: num(r.f3) || null, tag: b.label} : null;
    }).filter(Boolean);
    persistNames();
    p.loading = false;
    if (!p.rows.length) p.err = '这一页没有内容（已经翻到底了）';
  }).catch(function (e) {
    if (state.picker !== p) return;
    p.loading = false; p.err = '名单取不到：' + e.message + '（再点一次板块名重试）';
  }).then(renderPicker);
}

function pickerSearch() {
  var q = (document.getElementById('pkQuery').value || '').trim();
  if (!q) { pickerTab(state.picker && state.picker.board != null ? state.picker.board : 0); return; }
  state.picker = {mode: 'search', q: q, rows: [], loading: true, err: ''};
  renderPicker();
  var url = 'https://searchapi.eastmoney.com/api/suggest/get?input=' + encodeURIComponent(q) +
            '&type=14&count=20&invt=2';
  jsonp(url, 'sg', 8000).then(function (j) {
    var items = ((j && j.QuotationCodeTable) || {}).Data || [];
    var out = [];
    items.forEach(function (it) {
      var clsz = it.Classify;
      if (clsz === 'HK' && String(it.TypeUS) !== '3') return;
      if (['AStock', 'BStock', 'NEEQ', 'HK'].indexOf(clsz) < 0) return;
      if (clsz === 'HK' && HK_RMB_COUNTER_RE.test(String(it.Name || ''))) return;
      var sym = symFromPick(it.Code, it.MktNum);
      if (!sym) return;
      out.push({sym: sym, name: it.Name, tag: it.SecurityTypeName || ''});
    });
    state.picker.rows = out; state.picker.loading = false;
    if (!out.length) state.picker.err = '没有找到「' + q + '」对应的股票';
  }).catch(function (e) {
    state.picker.loading = false; state.picker.err = '搜索取不到：' + e.message;
  }).then(renderPicker);
}

function renderPicker() {
  var tabs = document.getElementById('pkTabs'), list = document.getElementById('pkList'),
      page = document.getElementById('pkPage'), p = state.picker;
  tabs.innerHTML = BOARDS.map(function (b, i) {
    return '<button data-board="' + i + '"' +
      (p && p.mode === 'browse' && p.board === i ? ' class="on"' : '') + '>' + b.label + '</button>';
  }).join('');
  Array.prototype.forEach.call(tabs.querySelectorAll('[data-board]'), function (el) {
    el.addEventListener('click', function () { pickerTab(+el.getAttribute('data-board')); });
  });

  if (p.loading) { list.innerHTML = '<div class="pkItem"><span class="nm2" style="color:var(--muted)">正在取名单…</span></div>'; page.innerHTML = ''; return; }
  if (p.err && !p.rows.length) { list.innerHTML = '<div class="err" style="margin:0;border-radius:0">' + esc(p.err) + '</div>'; page.innerHTML = ''; return; }
  list.innerHTML = p.rows.map(function (r) {
    var sym = r.sym, has = state.pool.indexOf(sym) >= 0;
    var name = r.name || state.names[sym] || '';
    var px = r.px == null ? '' : '　' + fx(r.px) + (r.pct == null ? '' :
      ' <span class="' + cls(r.pct) + '">' + (r.pct > 0 ? '+' : '') + r.pct.toFixed(2) + '%</span>');
    return '<div class="pkItem"><div><div class="nm2">' + esc(name || sym) + '</div>' +
      '<div class="cd">' + sym + (r.tag ? ' · ' + esc(r.tag) : '') + px + '</div></div>' +
      '<button data-add="' + sym + '" data-nm="' + esc(name) + '"' + (has ? ' class="has"' : '') + '>' +
      (has ? '已选' : '＋ 选') + '</button></div>';
  }).join('');
  Array.prototype.forEach.call(list.querySelectorAll('[data-add]'), function (el) {
    el.addEventListener('click', function () {
      addToPool(el.getAttribute('data-add'), el.getAttribute('data-nm'));

    });
  });
  page.innerHTML = p.mode === 'browse'
    ? '<button id="pkPrev"' + (p.pn <= 1 ? ' disabled' : '') + '>上一页</button>' +
      '<span>第 ' + p.pn + ' 页 · 共 ' + (p.total || '?') + ' 只</span>' +
      '<button id="pkNext"' + (p.rows.length < 100 ? ' disabled' : '') + '>下一页</button>'
    : '<span>找到 ' + p.rows.length + ' 只</span>';
  var prev = document.getElementById('pkPrev'), next = document.getElementById('pkNext');
  if (prev) prev.addEventListener('click', function () { pickerGo(-1); });
  if (next) next.addEventListener('click', function () { pickerGo(1); });
}
function addToPool(sym, name) {
  if (!sym) return;

  var added = state.pool.indexOf(sym) < 0;

function marketClock() {
  var now = new Date(), d = now.getDay(), hm = now.getHours() * 60 + now.getMinutes();
  var work = d >= 1 && d <= 5;
  return {
    cn: !work ? 'weekend' : (hm >= 555 && hm <= 900) ? 'open' : 'closed',
    hk: !work ? 'weekend' : (hm >= 540 && hm <= 970) ? 'open' : 'closed',
    text: now.toLocaleTimeString('zh-CN', {hour12: false})
  };
}

function fmtVol(v, unit) {
  if (v == null) return '—';
  if (v >= 1e8) return (v / 1e8).toFixed(2) + '亿' + unit;
  if (v >= 1e4) return (v / 1e4).toFixed(2) + '万' + unit;
  return Math.round(v) + unit;
}
function fmtAmt(v) {
  if (v == null || v === 0) return '—';
  if (v >= 1e8) return (v / 1e8).toFixed(2) + '亿';
  if (v >= 1e4) return (v / 1e4).toFixed(2) + '万';
  return Math.round(v) + '';
}
function cls(pct) { return pct == null ? 'flat' : pct > 0 ? 'up' : pct < 0 ? 'down' : 'flat'; }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
  return ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'})[c]; }); }

    var html = '<table><thead><tr><th>档位</th><th>买量(股)</th><th>卖量(股)</th><th>买额</th><th>卖额</th><th>笔数</th></tr></thead><tbody>';
    ['特大单', '大单', '中单', '小单'].forEach(function (k) {
      var a = lay[k];
      html += '<tr><td>' + k + '</td><td class="up">' + fmtVol(a.buy, '') + '</td><td class="down">' +
        fmtVol(a.sell, '') + '</td><td>' + fmtAmt(a.buyAmt) + '</td><td>' + fmtAmt(a.sellAmt) +
        '</td><td>' + a.cnt + '</td></tr>';
    });
    html += '</tbody></table><div class="note" style="margin:8px 2px 0">逐笔合计 ' + fmtVol(total, '股') +
      (buy && total ? '，主动买 ' + (buy / total * 100).toFixed(1) + '%' : '') + '</div>';
    host.innerHTML = html;
  }).catch(function (e) {
    if (state.tab === 'chart' && state.sel === sym)
      host.innerHTML = '<div class="note" style="margin:0">' + esc(e.message) + '</div>';
  });
}

function loadChartTab(sym, manual) {
  renderSymbar();
  renderChartHead(sym);
  renderBook(sym);
  renderFlow(sym);   // 逐笔自带 20s 缓存，随刷新走没问题
  /* 分时/日K 是重请求：极速轮询下每秒打一次会把本机打进对方冷却——
     手动刷新立即重取，自动路径同一标的 10 秒只取一次 */
  var last = state.chartAt[sym] || 0;
  if (!manual && Date.now() - last < 10000) return;
  state.chartAt[sym] = Date.now();
  var tsCv = document.getElementById('cv-ts'), klCv = document.getElementById('cv-kl');
  var r = state.rows[sym] || {};
  fetchTimeShare(sym).then(function (d) {
    if (state.tab !== 'chart' || state.sel !== sym) return;
    mountChart(tsCv, {key: 'ts', type: 'ts', rows: d.rows, pre: d.pre, height: 230,
                      volUnit: r.volume_unit || '手'});
  }).catch(function (e) {
    if (state.tab === 'chart' && state.sel === sym) drawEmpty(tsCv, 230, e.message);
  });
  fetchDaily(sym, 120).then(function (rows) {
    if (state.tab !== 'chart' || state.sel !== sym) return;
    document.getElementById('maLegend').innerHTML =
      MA_C.map(function (c, i) { return '<span class="ma ma' + i + '">MA' + MA_DAYS[i] + '</span>'; }).join(' ');
    mountChart(klCv, {key: 'kl', type: 'k', rows: rows, height: 300,
                      volUnit: isHK(sym) ? '股' : '手', prev: r.prev_close});
  }).catch(function (e) {
    if (state.tab === 'chart' && state.sel === sym) drawEmpty(klCv, 300, e.message);
  });
}

/* ---------------- 渲染：连接页 ---------------- */

function renderConnect() {
  var host = document.getElementById('srcList');
  host.innerHTML = ['tx', 'em', 'ths'].map(function (s) {
    var st = state.srcStatus[s];
    var dot = st === 'ok' ? 'ok' : st === 'bad' ? 'bad' : '';
    var stText = st === 'ok' ? '已连通' : st === 'bad' ? '连不上' : st === 'busy' ? '检测中…' : '未检测';
    var note = s === 'tx' ? '一次取整池 · 五档盘口 · 内外盘'
      : s === 'em' ? '官方内外盘 · 逐笔明细 · A股+港股'
      : '只覆盖 A 股 · 逐只取数';
    var ivMin = SRC_MIN_IV[s];
    return '<div class="srcrow"><span class="dot ' + dot + '"></span>' +
      '<div class="body"><div class="nm">' + SRC_NAME[s] + '</div>' +
      '<div class="st">' + note + ' · 最快 ' + ivMin + ' 秒一档 · ' + stText + '</div></div>' +
      '<div style="display:flex;flex-direction:column;gap:6px;align-items:flex-end">' +
      '<button class="use' + (state.source === s ? ' on' : '') + '" data-usesrc="' + s + '">' +
      (state.source === s ? '使用中' : '使用') + '</button>' +
      '<button class="mini" data-probe="' + s + '">' + (st === 'busy' ? '检测中' : '检测') + '</button>' +
      '</div></div>';
  }).join('');
  Array.prototype.forEach.call(host.querySelectorAll('[data-usesrc]'), function (b) {
    b.addEventListener('click', function () { useSource(b.getAttribute('data-usesrc')); });
  });
  Array.prototype.forEach.call(host.querySelectorAll('[data-probe]'), function (b) {
    b.addEventListener('click', function () { probeSource(b.getAttribute('data-probe')); });
  });
  renderPool();
  renderLinks();
}

function probeSource(s) {
  state.srcStatus[s] = 'busy';
  renderConnect();
  var job = s === 'tx' ? fetchTx(['000001.SH'])
    : s === 'em' ? fetchOneEm('000001.SH')
    : fetchOneThs('000001.SH');
  job.then(function () {
    state.srcStatus[s] = 'ok';
    setConnMsg(SRC_NAME[s] + ' 连通正常');
  }).catch(function (e) {
    state.srcStatus[s] = 'bad';
    setConnMsg(SRC_NAME[s] + ' 连不上：' + e.message);
  }).then(renderConnect);
}
function probeAllSources() {
  if (state.srcStatus.tx === undefined) probeSource('tx');
}
function setConnMsg(t) { document.getElementById('conn-msg').textContent = t || ''; }

function useSource(s) {
  if (state.source === s) return;
  var minIv = SRC_MIN_IV[s];
  if (state.interval < minIv) {
    state.interval = minIv;
    localStorage.setItem(LS.iv, String(minIv));
    setConnMsg(SRC_NAME[s] + ' 最快 ' + minIv + ' 秒一档，刷新间隔已自动调到 ' + minIv + ' 秒');
  } else {
    setConnMsg('已切换到' + SRC_NAME[s]);
  }
  state.source = s;
  localStorage.setItem(LS.src, s);
  state.tickCache = {};
  renderConnect();
  refreshAll(true);
}

function renderLinks() {
  var host = document.getElementById('openLinks');
  var sym = state.sel || state.pool[0] || '';
  if (!sym) { host.innerHTML = '<div class="note" style="margin:0">先加自选，再从这里用手机上的行情 App 打开这只票。</div>'; return; }
  var code6 = sym.slice(0, isHK(sym) ? 5 : 6);
  var links = [];
  if (!isHK(sym)) {
    links.push('<a href="https://stockpage.10jqka.com.cn/' + code6 + '/">同花顺</a>');
  }
  links.push('<a href="https://wap.eastmoney.com/quote/stock/' + emSecid(sym) + '.html">东方财富</a>');
  links.push('<a href="https://gu.qq.com/' + txCode(sym) + '">腾讯自选股</a>');
  host.innerHTML = links.join('');
}

function renderPool() {
  var host = document.getElementById('pool');
  host.innerHTML = state.pool.map(function (s) {
    var nm = nameOf(s);
    return '<span class="pill">' + esc(nm || s) + (nm ? '<i>' + s + '</i>' : '') +
      '<b data-del="' + s + '">✕</b></span>';
  }).join('') || '<div class="note" style="margin:0">自选是空的。点「＋ 选股票」或输入代码添加。</div>';
  Array.prototype.forEach.call(host.querySelectorAll('[data-del]'), function (b) {
    b.addEventListener('click', function () {
      var s = b.getAttribute('data-del');
      state.pool = state.pool.filter(function (x) { return x !== s; });
      if (state.sel === s) state.sel = state.pool[0] || null;
      savePool(); renderPool(); renderLinks(); refreshAll(false);
    });
  });
}

/* ---------------- 取数循环 ---------------- */

function refreshAll(manual) {
  if (state.busy) return Promise.resolve();
  if (!state.pool.length) { renderList(); renderTop(); return Promise.resolve(); }
  state.busy = true; renderTop();
  var fn = state.source === 'tx' ? fetchTx : state.source === 'em' ? fetchEm : fetchThs;
  return fn(state.pool).then(function (rows) {
    Object.keys(rows).forEach(function (s) { state.rows[s] = rows[s]; });
    if (state.source === 'ths') {
      state.pool.forEach(function (s) { if (rows[s]) { rows[s].outer = null; rows[s].inner = null; } });
    }
    rememberNames(state.rows);
    state.lastFetch = Date.now(); state.lastErr = ''; state.offline = !navigator.onLine;
  }).catch(function (e) {
    state.lastErr = e.message || '取数失败';
    state.offline = !navigator.onLine;
  }).then(function () {
    state.busy = false; renderTop(); renderList();
    if (state.tab === 'chart' && state.sel) loadChartTab(state.sel);
    if (manual) navigator.vibrate && navigator.vibrate(8);
  });
}

function restartTimer() {
  if (state.timer) clearInterval(state.timer);
  var iv = Math.max(state.interval, SRC_MIN_IV[state.source] || 1);
  if (iv <= 0) return;
  state.timer = setInterval(function () {
    var mc = marketClock();
    if (mc.cn !== 'open' && mc.hk !== 'open') { renderTop(); return; }
    refreshAll(false);
  }, iv * 1000);
}

/* ---------------- 本机存储 ---------------- */

function loadPool() {
  try {
    var raw = JSON.parse(localStorage.getItem(LS.pool) || 'null');
    if (Array.isArray(raw) && raw.length) return raw.filter(function (s) { return normalize(s); });
  } catch (e) {}
  return DEFAULT_POOL.slice();
}
function savePool() { localStorage.setItem(LS.pool, JSON.stringify(state.pool)); }

/* ---------------- 事件绑定 ---------------- */

function openSheet() {
  document.getElementById('sheet').classList.add('on');
  if (!state.picker) pickerTab(0);
  var q = document.getElementById('pkQuery');
  setTimeout(function () { q.focus(); }, 60);
}
function closeSheet() { document.getElementById('sheet').classList.remove('on'); }

function bind() {
  Array.prototype.forEach.call(document.querySelectorAll('#tabbar button'), function (b) {
    b.addEventListener('click', function () { setTab(b.getAttribute('data-tab')); });
  });
  document.getElementById('fab').addEventListener('click', openSheet);
  document.getElementById('btnPick').addEventListener('click', openSheet);
  document.getElementById('sheetClose').addEventListener('click', closeSheet);
  var pkq = document.getElementById('pkQuery');
  pkq.addEventListener('input', function () {
    clearTimeout(pkq._t);
    pkq._t = setTimeout(pickerSearch, 250);
  });
  pkq.addEventListener('keydown', function (e) { if (e.key === 'Enter') pickerSearch(); });

  document.getElementById('btnAdd').addEventListener('click', function () {
    var box = document.getElementById('addInput');
    var add = box.value.split(/[,，;；\s]+/).map(normalize).filter(Boolean);
    if (!add.length) { box.value = ''; return; }
    add.forEach(function (s) { if (state.pool.indexOf(s) < 0) state.pool.push(s); });
    box.value = ''; savePool(); renderPool(); renderLinks(); refreshAll(true);
  });

  window.addEventListener('online', function () { state.offline = false; renderTop(); refreshAll(true); });
  window.addEventListener('offline', function () { state.offline = true; renderTop(); });
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) refreshAll(false);
  });
  setInterval(renderTop, 1000);
}

bind();
setTab('watch');
renderPool();
renderList();
renderTop();
restartTimer();
refreshAll(false);
</script>
</body>
</html>
